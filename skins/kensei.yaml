name: kensei
description: KENSEI -- sword saint. Deep ink, blood lacquer, and drawn steel.
colors:
  # Core banner: black ink, blood lacquer, old gold, parchment.
  banner_border: "#8B0000"
  banner_title: "#D4A017"
  banner_accent: "#E34234"
  banner_dim: "#B8A89A"
  banner_text: "#E8DCC6"
  blade_glow: "#E34234"        # forge-red, used inside banner art
  blade_edge: "#E34234"        # blade-edge red, used inside banner art

  # General UI.
  ui_accent: "#C0392B"
  ui_label: "#D4B896"
  ui_ok: "#5B8C5A"
  ui_error: "#FF4444"
  ui_warn: "#F2A900"

  # Prompt, reasoning, and response surfaces.
  prompt: "#F2A900"
  input_rule: "#A52A2A"
  response_border: "#E34234"
  response_text: "#F5F0E8"
  reasoning_border: "#E66A3C"
  reasoning_text: "#F5DEB3"

  # Session identity.
  session_label: "#D4A017"
  session_border: "#7A2525"

  # Status bar and voice badge. Explicitly set so we are not inheriting random defaults.
  status_bar_bg: "#0A0A0A"
  status_bar_text: "#F5F0E8"
  status_bar_strong: "#D4A017"
  status_bar_dim: "#8B7E68"
  status_bar_good: "#6FA36F"
  status_bar_warn: "#D4A017"
  status_bar_bad: "#E34234"
  status_bar_critical: "#FF4444"
  voice_status_bg: "#0A0A0A"

  # Selection and completion menu.
  selection_bg: "#260808"
  completion_menu_bg: "#111111"
  completion_menu_current_bg: "#260808"
  completion_menu_meta_bg: "#111111"
  completion_menu_meta_current_bg: "#2A1010"
spinner:
  waiting_faces:
    - (⚔)
    - (◉)
    - (⌁)
    - (▲)
  thinking_faces:
    - (⚔)
    - (⌁)
    - (◉)
  thinking_verbs:
    - drawing steel
    - reading the wind
    - finding stillness
    - cutting noise
    - holding breath
    - measuring distance
    - waiting in shadow
    - tempering the edge
    - watching the line
    - feeling the weight
    - seeking the opening
    - preparing the cut
  wings:
    - - ⟪⚔
      - ⚔⟫
