  agent_name: KENSEI
  welcome: "[#D4A017]Steel drawn. State your objective.[/]"
  goodbye: Committing seppuku
  response_label: " ⚔ KENSEI "
  prompt_symbol: "⚔ "
  help_header: (⚔) Commands
